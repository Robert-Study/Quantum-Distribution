name: Validate BB84 companion

on:
  push:
    branches: [main]
    paths:
      - "bb84.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "bb84.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run analytical and statistical tests
        run: python -m unittest discover -s tests -v
      - name: Install plotting dependency
        run: python -m pip install -r requirements.txt
      - name: Reproduce calculations and figures
        run: python bb84.py --pulses 100000 --seed 42 --plot --output results
      - name: Record software versions
        run: python -m pip freeze > results/environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bb84-results
          path: results/
          if-no-files-found: error
          retention-days: 30
